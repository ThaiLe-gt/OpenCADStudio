<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#1e1e1e" />
    <title>Open CAD Studio Web App</title>
    <link data-trunk rel="icon" href="assets/logo.svg" />
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #1e1e1e; }
      canvas { display: block; }
      #loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: #1e1e1e;
        color: #cfcfcf;
        font-family: system-ui, sans-serif;
        z-index: 9999;
        transition: opacity 0.4s ease;
      }
      #loading.hide { opacity: 0; pointer-events: none; }
      #loading .title { font-size: 22px; font-weight: 600; letter-spacing: 0.5px; }
      #loading .title span { color: #3399e6; }
      #loading .sub { font-size: 12px; color: #777; }
      #loading .spinner {
        width: 46px;
        height: 46px;
        border: 4px solid #2e2e2e;
        border-top-color: #3399e6;
        border-radius: 50%;
        animation: ocs-spin 0.9s linear infinite;
      }
      @keyframes ocs-spin { to { transform: rotate(360deg); } }
    </style>
    <link data-trunk rel="rust" data-bin="OpenCADStudio" />
    <link data-trunk rel="copy-dir" href="web/fonts" />
    <link data-trunk rel="copy-file" href="web/ocs-parse-worker.js" />
    <link data-trunk rel="copy-file" href="web/discussions.json" />
    <link data-trunk rel="copy-file" href="web/videos.json" />
    <link data-trunk rel="copy-file" href="web/locale-labels.json" />
  </head>
  <body>
    <div id="loading">
      <div class="spinner"></div>
      <div class="title">Open <span>CAD</span> Studio</div>
      <div class="sub">Loading…</div>
    </div>
    <script>
      // Metal embeds this exact WebAssembly application in its desktop workbench.
      // Commands remain inside OpenCADStudio's own document/tab runtime; this
      // small same-origin queue only transports user-approved file bytes and NEW.
      window.__METAL_OPENCAD_COMMANDS = [];
      window.__METAL_OPENCAD_COMMAND_IDS = new Set();
      // Presentation the host chooses: colour scheme, whether the ribbon is
      // shown, and the welcome page text. The host puts its starting values in
      // the page address so the first frame already matches; later changes
      // arrive as `set_ui` commands. The Rust application reads this object.
      try {
        const query = (window.location && window.location.search) || "";
        const param = name => {
          const match = new RegExp("[?&]" + name + "=([^&]*)").exec(query);
          return match ? decodeURIComponent(match[1].replace(/\+/g, " ")) : undefined;
        };
        if (param("scheme") !== undefined) {
          let tips = [];
          try { tips = JSON.parse(param("tips") || "[]"); } catch {}
          window.__METAL_UI = {
            scheme: param("scheme"), toolbar: param("toolbar") === "1", title: param("title") || "",
            subtitle: param("subtitle") || "", tips: Array.isArray(tips) ? tips.filter(tip => typeof tip === "string") : []
          };
        }
      } catch {}
      window.__METAL_ENQUEUE_COMMAND = (command, replyOrigin = "*") => {
        if (!command || command.source !== "metal") return;
        if (command.type === "set_ui") {
          window.__METAL_UI = {
            scheme: command.scheme === "dark" ? "dark" : "light",
            toolbar: command.toolbar === true,
            title: typeof command.title === "string" ? command.title : "",
            subtitle: typeof command.subtitle === "string" ? command.subtitle : "",
            tips: Array.isArray(command.tips) ? command.tips.filter(tip => typeof tip === "string") : []
          };
          return;
        }
        if (command.type === "model_overlay_registry") {
          window.__METAL_MODEL_OVERLAY_REGISTRY = command.registry;
          return;
        }
        if (command.type === "selection_snapshot") {
          // Force the Rust/WASM bridge to republish the current selection even
          // when its handles and document revision have not changed. Metal uses
          // this fresh native descriptor set immediately before a large agent run.
          window.__METAL_LAST_SELECTION_STATE = null;
          window.__METAL_SELECTION_DETAILS_REQUESTED = true;
          return;
        }
        if (command.type === "capture") {
          if (window.__METAL_CAPTURE_PENDING) {
            window.parent?.postMessage({ source: "opencadstudio", type: "capture_failed", requestId: command.requestId, error: "Capture already pending" }, replyOrigin);
            return;
          }
          window.__METAL_CAPTURE_PENDING = true;
          requestAnimationFrame(async () => {
            try {
              const documentName = window.__METAL_DRAWING_NAME;
              const revision = window.__METAL_DRAWING_REVISION;
              if (command.expected && (command.expected.documentName !== documentName || command.expected.revision !== revision)) throw new Error("Drawing revision does not match requested capture");
              const canvas = document.querySelector("canvas");
              if (!(canvas instanceof HTMLCanvasElement)) throw new Error("OpenCAD canvas is unavailable");
              // Bound readback/encoding cost. Do not synchronously encode the full CAD framebuffer.
              const scale = Math.min(1, 1600 / Math.max(canvas.width, canvas.height));
              const copy = document.createElement("canvas");
              copy.width = Math.max(1, Math.round(canvas.width * scale));
              copy.height = Math.max(1, Math.round(canvas.height * scale));
              const context = copy.getContext("2d");
              if (!context) throw new Error("Capture context unavailable");
              context.drawImage(canvas, 0, 0, copy.width, copy.height);
              const blob = await new Promise((resolve, reject) => copy.toBlob(value => value ? resolve(value) : reject(new Error("Capture encoding failed")), "image/png"));
              const dataUrl = await new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = () => reject(reader.error);
                reader.readAsDataURL(blob);
              });
              if (documentName !== window.__METAL_DRAWING_NAME || revision !== window.__METAL_DRAWING_REVISION) throw new Error("Drawing changed during capture encoding");
              window.parent?.postMessage({
                source: "opencadstudio", type: "capture_ready",
                requestId: command.requestId, dataUrl, documentName, revision
              }, replyOrigin);
            } catch (error) {
              window.parent?.postMessage({
                source: "opencadstudio", type: "capture_failed",
                requestId: command.requestId, error: String(error)
              }, replyOrigin);
            } finally {
              window.__METAL_CAPTURE_PENDING = false;
            }
          });
          return;
        }
        if (!["new", "open", "replace", "snapshot", "qa_focus", "qa_restore", "clear_selection", "apply_style", "apply_native_operations"].includes(command.type)) return;
        const commandId = typeof command.commandId === "string" ? command.commandId : "";
        const duplicate = commandId.length > 0 && window.__METAL_OPENCAD_COMMAND_IDS.has(commandId);
        if (!duplicate) {
          window.__METAL_OPENCAD_COMMANDS.push(command);
          if (commandId.length > 0) window.__METAL_OPENCAD_COMMAND_IDS.add(commandId);
        }
        window.parent?.postMessage({
          source: "opencadstudio", type: "command_received", commandId,
          commandType: command.type, duplicate,
          byteLength: command.bytes?.byteLength ?? command.bytes?.length ?? 0
        }, "*");
      };
      window.addEventListener("message", (event) => {
        // Tauri/WebKit may serialize custom-protocol origins as `null` even
        // though the parent and this relative iframe are the same document
        // origin. Source identity is the authoritative boundary here.
        if (event.source !== window.parent) return;
        const replyOrigin = event.origin === "null" ? "*" : event.origin;
        window.__METAL_ENQUEUE_COMMAND(event.data, replyOrigin);
      });
      (() => {
        const splash = document.getElementById("loading");
        fetch("locale-labels.json").then(response => response.json()).then(labels => {
          let saved;
          try {
            saved = JSON.parse(localStorage.getItem("opencadstudio.settings"))?.settings?.language;
          } catch {}
          const preferred = navigator.languages?.length ? navigator.languages : [navigator.language];
          const requested = typeof saved === "string" && saved !== "system" ? [saved, ...preferred] : preferred;
          const available = Object.keys(labels);
          let locale = "en-US";
          for (const candidate of requested) {
            try {
              const language = new Intl.Locale(candidate);
              const match = available.find(value => value.toLowerCase() === language.baseName.toLowerCase())
                || (language.language === "zh"
                  ? (language.maximize().script === "Hant" ? "zh-TW" : "zh-CN")
                  : available.find(value => value.startsWith(language.language + "-")));
              if (match) { locale = match; break; }
            } catch {}
          }
          document.title = labels[locale].title;
          document.documentElement.lang = locale;
          document.documentElement.dir = locale === "ar-SA" ? "rtl" : "ltr";
          const caption = splash?.querySelector(".sub");
          if (caption) caption.textContent = labels[locale].loading;
        }).catch(() => {});
        const done = () => {
          if (!splash) return;
          splash.classList.add("hide");
          window.parent?.postMessage({ source: "opencadstudio", type: "ready" }, "*");
          setTimeout(() => splash.remove(), 450);
        };
        if (document.querySelector("canvas")) return done();
        const observer = new MutationObserver(() => {
          if (document.querySelector("canvas")) {
            observer.disconnect();
            done();
          }
        });
        observer.observe(document.body, { childList: true, subtree: true });
      })();
    </script>
  </body>
</html>
